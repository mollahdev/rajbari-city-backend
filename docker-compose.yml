version: '3.8'

services:
  bd_city_api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - web_network
    depends_on:
      - mysql_db
    command: >
      sh -c "until nc -z mysql_db 3306; do echo 'Waiting for MySQL...'; sleep 3; done; npm run migrate; npm run dev"

  mysql_db:
    image: mysql:latest
    container_name: mysql_container
    restart: always
    environment:
      # We use $$ to escape the dollar sign so Docker doesn't think it's a variable
      - MYSQL_ROOT_PASSWORD=K9#pZ2!mX7qR_vN9
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    # Standard internal port; not exposed to public unless you use 3306:3306
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - web_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_container
    restart: always
    depends_on:
      - mysql_db
    environment:
      - PMA_HOST=mysql_db
      - MAX_EXECUTION_TIME=1000
    ports:
      - "9421:80"
    networks:
      - web_network

networks:
  web_network:
    driver: bridge

volumes:
  # This section is mandatory to prevent "undefined volume" errors
  mysql_data:
