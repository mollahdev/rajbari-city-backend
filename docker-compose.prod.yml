version: '3.8'

services:
  bdcity_prod_api:
    image: bdcityapp/bdcityapi:1.0.0
    container_name: bdcity_prod_api
    environment:
      - APP_PORT=80
      - NODE_ENV=production
      # Database connections will be injected via Hostinger/Server Environment Variables
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # Other Secrets
      - JWT_SECRET=${JWT_SECRET}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_SENDER_ID=${SMS_SENDER_ID}
      - STORAGE_BASE=${STORAGE_BASE}
      - STORAGE_HOST=${STORAGE_HOST}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - web_network
    depends_on:
      - mysql_db
    command: >
      sh -c "until nc -z mysql_db 3306; do echo 'Waiting for MySQL...'; sleep 3; done; npm run migrate; npm run start"
networks:
  web_network:
    external: true
    driver: bridge
